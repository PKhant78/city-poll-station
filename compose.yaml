services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: poll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poll}
      POSTGRES_DB: poll
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - poll-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poll -d poll"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  poll-data:
